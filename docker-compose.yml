version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: abuhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: abuhub_dev
      MYSQL_USER: abuhub
      MYSQL_PASSWORD: abuhubpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: abuhub-backend:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - mysql

  # Frontend (Next.js) service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: abuhub-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.production
    depends_on:
      - backend

  # Optional MongoDB for services that use mongoose
  mongo:
    image: mongo:6.0
    container_name: abuhub-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
